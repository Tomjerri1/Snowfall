name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tagVer = $env:TAG.TrimStart('v')
          $base = $tagVer.Split('-')[0]
          if ($cargo -ne $tagVer -and $cargo -ne $base) {
            Write-Error "Tag $env:TAG does not match Cargo.toml version $cargo"
            exit 1
          }
      - run: cargo test --locked --all-targets
      - run: cargo build --release --locked
      - name: Package zip
        shell: pwsh
        run: |
          $name = "snowfall-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/snowfall.exe $name/
          Copy-Item README.md, LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = $env:TAG.TrimStart('v')
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "/O$PWD" "/Fsnowfall-$env:TAG-windows-x64-setup" installer\snowfall.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $setup = "snowfall-$env:TAG-windows-x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Out-File -Encoding ascii "$setup.sha256"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = "snowfall-$env:TAG-windows-x64"
          $setup = "snowfall-$env:TAG-windows-x64-setup.exe"
          $lines = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$env:TAG --jq .body
          $notes = ($lines | Where-Object { $_ -notmatch 'Full Changelog' }) -join "`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          $flags = @()
          if ($env:TAG -match '-') { $flags += '--prerelease' }
          gh release create $env:TAG "$zip.zip" "$zip.zip.sha256" $setup "$setup.sha256" --notes-file notes.md --title "Snowfall $env:TAG" @flags
