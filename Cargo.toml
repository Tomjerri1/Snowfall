[package]
name = "snowfall"
version = "0.1.2"
edition = "2021"

[dependencies]
tiny-skia = "0.11"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Media",
    "Win32_Networking_WinHttp"
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr", "shm"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "mm"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
